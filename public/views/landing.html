<!doctype html>
<html lang="en" class="no-js" data-brand="{{BRAND_THEME}}">
    <head>
        <!-- Title and Icon -->

        <title id="landingTitle">{{BRAND_LANDING_TITLE}}</title>
        <link id="shortcutIcon" rel="shortcut icon" type="image/jpeg" href="../images/sgc-favicon.jpg" />
        <link id="appleTouchIcon" rel="apple-touch-icon" href="../images/sgc-logo.jpg" />

        <!-- Meta Information -->

        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <meta name="description" content="{{OG_DESCRIPTION}}" />

        <!-- https://ogp.me -->

        <meta property="og:type" content="{{OG_TYPE}}" />
        <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
        <meta property="og:title" content="{{OG_TITLE}}" />
        <meta property="og:description" content="{{OG_DESCRIPTION}}" />
        <meta property="og:image" content="{{OG_IMAGE}}" />
        <meta property="og:url" content="{{OG_URL}}" />

        <!-- xss -->

        <script src="../vendor/xss/xss.min.js"></script>

        <!-- https://cdnjs.com/libraries/font-awesome -->

        <link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css" />

        <!-- StyleSheet -->

        <link rel="stylesheet" href="../css/landing.css" />
        <link rel="stylesheet" href="../css/newcall.css" />

        <!-- https://animate.style 4 using for swal fadeIn-Out -->

        <link rel="stylesheet" href="../vendor/animate.css/animate.min.css" />

        <!-- Brand palette (theme selected via html[data-brand]; loaded last so it overrides) -->

        <link rel="stylesheet" href="../css/brand.css" />

        <!-- sweetalert -->

        <script defer src="../vendor/sweetalert2/sweetalert2.all.min.js"></script>
    </head>
    <body class="has-animations">
        <div class="body-wrap">
            <header class="site-header reveal-from-top">
                <div class="container">
                    <div class="site-header-inner">
                        <div class="brand">
                            <div class="m-0">
                                <a href="/">
                                    <img
                                        id="brandLogo"
                                        class="brand-logo"
                                        src="{{BRAND_LOGO}}"
                                        alt="brand logo"
                                        width="48"
                                        height="48"
                                    />
                                </a>
                            </div>
                        </div>
                        <!-- Optional-OIDC sign-in status (populated by common.js from /profile) -->
                        <div id="authStatus" class="auth-status"></div>
                    </div>
                </div>
            </header>
            <main class="site-content">
                <section class="cta section center-content-mobile reveal-from-bottom mb-32">
                    <div class="container">
                        <div class="cta-inner section-inner cta-split br-12">
                            <div class="cta-slogan">
                                <h3 id="appJoinDescription" class="m-0">Pick a room name.</h3>
                            </div>
                            <div class="cta-action">
                                <div class="mb-0">
                                    <label class="form-label screen-reader" for="roomName">Room name</label>
                                    <div class="form-group-desktop">
                                        <div class="room-input-wrap">
                                            <input
                                                id="roomName"
                                                class="form-input"
                                                type="text"
                                                value="mirotalk"
                                                maxlength="32"
                                            />
                                            <button
                                                id="genRoomButton"
                                                class="room-gen-btn fas fa-arrows-rotate"
                                            ></button>
                                        </div>
                                        <button id="joinRoomButton" class="button button-primary br-6">
                                            Join Room
                                        </button>
                                    </div>
                                    <div class="mt-16">
                                        <button
                                            id="customizeRoomButton"
                                            class="button button-custom-room button-block br-6"
                                        >
                                            Customize Room
                                        </button>
                                    </div>
                                </div>
                                <div id="lastRoomContainer" class="last-room">
                                    <span id="appJoinLastRoom">Your recent room:</span>
                                    <a id="lastRoom"></a>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Live room list: open + locked(knockable) rooms; private rooms are hidden.
                     Populated by common.js from /roomList (gated by SHOW_ACTIVE_ROOMS). -->
                <section id="roomsSection" class="rooms-section section center-content-mobile reveal-from-bottom mb-32">
                    <div class="container">
                        <div class="rooms-inner cta-inner section-inner br-12">
                            <h3 class="term-title rooms-title">Available Rooms</h3>
                            <div id="roomList" class="room-list"></div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
        <script defer src="../js/utils.js"></script>
        <script defer src="../js/common.js"></script>
        <script defer src="../js/brand.js"></script>
        <script defer src="../js/landing.js"></script>
    </body>
</html>
