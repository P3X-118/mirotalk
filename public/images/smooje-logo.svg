<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Libations">
    <defs>
        <linearGradient id="drink" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ff4650" />
            <stop offset="1" stop-color="#ff2129" />
        </linearGradient>
    </defs>
    <!-- console panel -->
    <rect width="96" height="96" rx="6" fill="#050507" />
    <rect x="1.5" y="1.5" width="93" height="93" rx="5" fill="none" stroke="#7a0e12" stroke-width="2" />
    <!-- corner brackets -->
    <path d="M8 8 h12 M8 8 v12 M88 88 h-12 M88 88 v-12" stroke="#ff2129" stroke-width="2.5" fill="none" />
    <!-- terminal prompt -->
    <text x="14" y="30" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700" fill="#ff2129">&gt;_</text>
    <!-- glass (wireframe, phosphor red) -->
    <path d="M32 40 L64 40 L58 78 Q58 82 54 82 L42 82 Q38 82 38 78 Z" fill="none" stroke="url(#drink)" stroke-width="2.5" />
    <path d="M32 40 L64 40 L62.5 49 L33.5 49 Z" fill="#ff2129" fill-opacity="0.18" />
    <!-- straw -->
    <rect x="56" y="20" width="4" height="26" rx="2" fill="#ff4650" transform="rotate(16 58 33)" />
    <!-- bubbles -->
    <circle cx="45" cy="58" r="2.6" fill="#ff4650" fill-opacity="0.7" />
    <circle cx="52" cy="66" r="1.8" fill="#ff4650" fill-opacity="0.5" />
    <circle cx="46" cy="72" r="1.4" fill="#ff4650" fill-opacity="0.4" />
</svg>
